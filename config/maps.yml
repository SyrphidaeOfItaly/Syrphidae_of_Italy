# Base layers for every map on SoI (the first is the default; visitors can
# switch with the layers button, and their choice is remembered).
map_tiles:
  - label: Light
    server: 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}'
    attribution: 'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors'
    maxNativeZoom: 16
  - label: OpenStreetMap
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    server: https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png
  - label: GBIF
    attribution: '&copy; <a href="https://gbif.org">GBIF.org</a>'
    server: https://tile.gbif.org/3857/omt/{z}/{x}/{y}@1x.png?style=gbif-natural-en
  - label: Terrain
    server: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png'
    attribution: 'Map data &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, SRTM | Style &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)'
    maxNativeZoom: 17
  - label: Satellite
    server: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
    attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community'
